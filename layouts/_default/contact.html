{{ define "main" }}
<article>
  <header>
    <h1 class="mt-0 text-4xl font-extrabold text-neutral-900 dark:text-neutral">
      {{ .Title }}
    </h1>
  </header>

  <section class="flex flex-col max-w-lg mx-auto mt-8">
    {{ .Content }}

    <form action="https://formspree.io/f/xjvdgzjw" method="POST" class="flex flex-col gap-4 mt-6">
      <input
        name="email"
        type="email"
        required
        placeholder="Your email"
        class="px-4 py-3 rounded-lg border-2 border-primary-500 bg-transparent text-neutral-900 dark:text-neutral outline-none focus:border-primary-700 transition-colors"
      />
      <textarea
        name="text"
        required
        placeholder="Your message"
        rows="5"
        class="px-4 py-3 rounded-lg border-2 border-primary-500 bg-transparent text-neutral-900 dark:text-neutral outline-none focus:border-primary-700 transition-colors resize-y"
      ></textarea>
      <button
        type="submit"
        class="px-6 py-3 rounded-lg bg-primary-600 text-white font-bold text-lg hover:bg-primary-700 transition-colors cursor-pointer"
      >
        SUBMIT
      </button>
    </form>
  </section>
</article>
{{ end }}
